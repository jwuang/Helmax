name: Deploy Helmax website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/design/helmax-exhibition-prototype.html'
      - 'docs/design/assets/**'
      - 'scripts/build-pages.ts'
      - 'scripts/check-design-prototype.mjs'
      - 'scripts/lib/**'
      - 'tests/unit/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Helmax website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
