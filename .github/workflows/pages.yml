name: Redirect legacy GitHub Pages URLs to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-legacy-redirects.ts'
      - 'scripts/lib/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - name: Verify Cloudflare is serving the website before replacing the old site
        run: |
          for path in / /zh-cn/ /zh-hk/ /en/; do
            curl --fail --silent --show-error --retry 3 "https://helmax.1143402012.workers.dev$path" -o /tmp/helmax-page.html
            grep -q 'Helmax' /tmp/helmax-page.html
          done
      - run: node --import tsx scripts/build-legacy-redirects.ts
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload legacy redirects
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-redirects

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy legacy redirects
        id: deployment
        uses: actions/deploy-pages@v5
